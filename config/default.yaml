input:
  encoding: cp1252
  delimiter: ";"
  crs: null
defaults:
  agency:
    agency_timezone: Europe/Berlin
    agency_lang: de
    agency_url: https://example.org
    agency_email: example@example.org
    cemv_support: 0
  routes:
    route_type: 3
    cemv_support: 0
overrides: {}
mapping:
  mode_of_transport:
    0: 2
    1: 2
    2: 1
    3: 0
    4: 0
    5: 3
    6: 3
    7: 3
    8: 6
    9: 4
    10: 3
    11: 1700
    12: 1100
ids:
  agency:
    mode: template
    template: "agency:{gtfs.canonical}"
  levels:
    mode: template
    template: "level:{stop_area.VERSION}:{stop_area.STOP_NR}:{stop_area.STOP_AREA_LEVEL}"
  stops:
    mode: global
    template: "stop:{gtfs.canonical}"
  routes:
    mode: global
    template: "route:{gtfs.canonical}"
  calendar:
    mode: template
    template: "service:{gtfs.canonical}"
  shapes:
    mode: template
    template: "shape:{gtfs.canonical}"
  trips:
    mode: global
    template: "trip:{trip.VERSION}:{trip.LINE_NR}:{trip.STR_LINE_VAR}:{trip.LINE_DIR_NR}:{trip.TRIP_ID}:{gtfs.split_key}"
  location_groups:
    mode: template
    template: "location_group:{gtfs.location_group_fingerprint}"
  locations:
    mode: template
    template: "location:{gtfs.location_fingerprint}"
  booking_rules:
    mode: template
    template: "booking_rule:{gtfs.booking_rule_fingerprint}"
  fare_attributes:
    mode: template
    template: "fare:{gtfs.fare_fingerprint}"
  timeframes:
    mode: template
    template: "timeframe_group:{gtfs.timeframe_group_fingerprint}"
  rider_categories:
    mode: template
    template: "rider_category:{gtfs.rider_category_fingerprint}"
  fare_media:
    mode: template
    template: "fare_media:{gtfs.fare_media_fingerprint}"
  fare_products:
    mode: template
    template: "fare_product:{gtfs.fare_product_fingerprint}"
  areas:
    mode: template
    template: "farearea:{fare_zone.VERSION}:{fare_zone.FARE_ZONE_NR}"
  networks:
    mode: template
    template: "network:{gtfs.network_fingerprint}"
  pathways:
    mode: template
    template: "pathway:{stop_footpath.VERSION}:{stop_footpath.ORIG_STOP_NR}:{stop_footpath.ORIG_STOP_AREA_NR}:{stop_footpath.DEST_STOP_NR}:{stop_footpath.DEST_STOP_AREA_NR}:{gtfs.row_hash}"
  notices:
    mode: template
    template: "notice:{notice.VERSION}:{notice.NOTICE}"
  trip_segments:
    mode: template
    template: "segment:{gtfs.trip_id}:{gtfs.from_stop_sequence}:{gtfs.to_stop_sequence}"
  attributions:
    mode: template
    template: "attribution:{operator.OP_CODE}:{gtfs.row_hash}"
features:
  transfers: true
  notices: true
