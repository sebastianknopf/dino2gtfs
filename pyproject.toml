[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "dino2gtfs"
dynamic = ["version"]
description = "Profile-based DINO to GTFS Schedule converter"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "dino2gtfs contributors"}]
dependencies = ["PyYAML>=6.0,<7", "pyproj>=3.6,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dino2gtfs = "dino2gtfs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dino2gtfs.infrastructure" = ["gtfs_static_schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools_scm]
version_file = "src/dino2gtfs/version.py"
fallback_version = "0.0.0"
local_scheme = "no-local-version"
